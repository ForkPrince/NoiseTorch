---
name: Build Dev Artifact

on:
  push:
    branches:
      - 'master'
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v4
        with:
          go-version: "1.24"
      - uses: actions/checkout@v4
      - name: Install GTK4 build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libglib2.0-dev
      - run: make dev
      - uses: actions/upload-artifact@v4
        with:
          name: linux_x64
          path: ${{ github.workspace }}/bin/noisetorch
